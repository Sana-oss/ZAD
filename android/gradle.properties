# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx1536m

# AndroidX
android.useAndroidX=true

# Register Android Studio's bundled JDK 21 for Gradle toolchain detection
# (required by Capacitor plugin modules; system JDK is 25) and run Gradle
# itself on it (Android lint does not support JDK 25).
org.gradle.java.installations.paths=C\:\\Program Files\\Android\\Android Studio\\jbr
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
